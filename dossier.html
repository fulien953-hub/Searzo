<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Searzo — AI Visibility Dossier</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,300&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0f14; font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  nav { padding: 20px 48px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .logo { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 900; color: #eeecea; text-decoration: none; }
  .logo span { color: #6b93ff; }
  .back { font-size: 13px; color: rgba(238,236,234,0.5); text-decoration: none; letter-spacing: 0.05em; transition: color 0.2s; }
  .back:hover { color: #6b93ff; }
  .header { padding: 32px 48px 24px; }
  .doc-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 900; color: #eeecea; }
  .doc-tag { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #6b93ff; margin-top: 4px; }
  .viewer { flex: 1; margin: 0 48px 48px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; min-height: 85vh; }
  iframe { width: 100%; height: 85vh; border: none; display: block; }
  @media (max-width: 768px) { nav { padding: 16px 20px; } .header { padding: 20px 20px 16px; } .viewer { margin: 0 20px 32px; } iframe { height: 75vh; } }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">Sear<span>zo</span></a>
  <a href="/" class="back">← Back to site</a>
</nav>
<div class="header">
  <div class="doc-title">AI Visibility Dossier — Sample</div>
  <div class="doc-tag">Confidential · White-Label Deliverable · May 2026</div>
</div>
<div class="viewer">
  <iframe src="dossier.pdf" type="application/pdf"></iframe>
</div>
</body>
</html>
